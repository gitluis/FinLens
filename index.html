<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinLens — Personal Finances</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300C49A'/><text x='16' y='23' text-anchor='middle' font-size='15' font-weight='700' font-family='Sora,system-ui,sans-serif' fill='%230b1220'>FL</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- marked + DOMPurify are pinned with SRI hashes: they render Claude's output, so a
     tampered or silently upgraded CDN file must fail closed. All Markdown goes through
     renderMarkdown() in core.js. -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>

<style>
/* =============== THEME =============== */
:root {
  --sidebar:#0F1C2E;
  --sidebar-2:#16263d;
  --sidebar-text:#cbd5e1;
  --sidebar-text-active:#ffffff;
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --surface-2:#F2F4F8;
  --border:#E5E8EE;
  --text:#0B1220;
  --text-2:#475569;
  --text-3:#94A3B8;
  --teal:#00C49A;
  --teal-soft:#E6FAF4;
  --amber:#F59E0B;
  --amber-soft:#FEF3C7;
  --red:#EF4444;
  --red-soft:#FEE2E2;
  --blue:#3B82F6;
  --purple:#8B5CF6;
  --shadow:0 1px 2px rgba(15,28,46,.04), 0 4px 12px rgba(15,28,46,.06);
  --radius:12px;
  --radius-sm:8px;
}
[data-theme="dark"] {
  --bg:#0B1220;
  --surface:#111B2E;
  --surface-2:#16243C;
  --border:#22324C;
  --text:#E5E8EE;
  --text-2:#94A3B8;
  --text-3:#64748B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Sora',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.mono,.num{font-family:'DM Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* =============== LAYOUT =============== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{
  background:var(--sidebar);
  color:var(--sidebar-text);
  padding:20px 12px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.sidebar .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),#00a884);display:grid;place-items:center;font-weight:700;color:#0b1220;font-size:13px}
.sidebar .brand .title{font-weight:600;color:#fff;letter-spacing:.2px}
.sidebar .brand .sub{font-size:11px;color:#64748b;margin-top:1px}
.sidebar a.nav{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  color:var(--sidebar-text);font-size:13.5px;text-decoration:none;
  transition:background .15s,color .15s;
}
.sidebar a.nav:hover{background:var(--sidebar-2);color:#fff}
.sidebar a.nav.active{background:var(--sidebar-2);color:#fff;font-weight:500}
.sidebar a.nav .ic{width:18px;height:18px;display:inline-grid;place-items:center;font-size:14px;color:var(--teal)}
.sidebar .group{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#475569;padding:14px 12px 6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;border-radius:6px;transition:background .12s}
.sidebar .group:hover{background:rgba(255,255,255,.04)}
.sidebar .group .nav-toggle{font-size:9px;color:#475569;transition:transform .2s}
.sidebar .group.collapsed .nav-toggle{transform:rotate(-90deg)}
.nav-section{overflow:hidden;transition:max-height .25s ease,opacity .2s ease;max-height:600px;opacity:1}
.nav-section.collapsed{max-height:0;opacity:0}
.sidebar .footer{margin-top:auto;padding:10px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.06)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:5;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:10px 22px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.topbar .crumb{font-weight:600;font-size:15px;margin-right:auto}
.topbar .crumb .sub{color:var(--text-3);font-weight:400;margin-left:8px;font-size:12px}
.range-btns{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.range-btns button{border:0;background:transparent;color:var(--text-2);padding:5px 10px;border-radius:7px;font-size:12px;}
.range-btns button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.acct-filter,.range-custom{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--text);}

.content{padding:22px;display:flex;flex-direction:column;gap:18px}
section.view{display:none;flex-direction:column;gap:18px;animation:fade .25s ease}
section.view.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
h1.page-title{font-size:22px;font-weight:600;margin:0}
h2.section-title{font-size:15px;font-weight:600;margin:0;color:var(--text)}
.muted{color:var(--text-3)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.sidebar .brand,.sidebar .group,.sidebar .footer{display:none}.sidebar a.nav{flex:0 0 auto;font-size:12px;padding:6px 10px}.sidebar a.nav .ic{display:none}}

/* =============== COMPONENTS =============== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--text-2);letter-spacing:.2px}
.card .big{font-size:24px;font-weight:600;letter-spacing:-.3px}
.card .delta{font-size:12px;margin-top:4px}
.delta.up{color:var(--teal)}
.delta.down{color:var(--red)}
.card .footnote{font-size:11.5px;color:var(--text-3);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;background:var(--surface-2);font-size:11.5px;color:var(--text-2);border:1px solid var(--border)}
.pill.good{background:var(--teal-soft);color:#0b6b56;border-color:transparent}
.pill.warn{background:var(--amber-soft);color:#92400e;border-color:transparent}
.pill.bad{background:var(--red-soft);color:#991b1b;border-color:transparent}

.btn{background:var(--teal);color:#02201a;border:0;padding:8px 14px;border-radius:9px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;color:var(--text-2);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tr:hover td{background:var(--surface-2)}
table.tbl tr.click{cursor:pointer}
.amt-pos{color:var(--teal);font-weight:500}
.amt-neg{color:var(--red);font-weight:500}
.amt-tx{color:var(--text-3)}

.input,.select,.textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);}
.textarea{min-height:90px;resize:vertical;font-family:inherit}
label.lbl{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:4px}

.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:var(--teal);transition:width .3s}
.progress.warn > div{background:var(--amber)}
.progress.bad > div{background:var(--red)}

/* chart wrappers must have explicit height so Chart.js doesn't loop */
.chart-wrap{position:relative;height:260px;width:100%;overflow:hidden}
.chart-wrap.tall{height:340px}
.chart-wrap.short{height:160px}
.chart-wrap.sm{height:200px}
.chart-wrap canvas{display:block}

.empty{border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;color:var(--text-2);background:var(--surface)}
.empty h4{margin:0 0 8px;color:var(--text)}
.kbd{font-family:'DM Mono';font-size:11px;background:var(--surface-2);padding:2px 6px;border-radius:5px;border:1px solid var(--border)}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--teal)}
.dot.amber{background:var(--amber)}
.dot.red{background:var(--red)}
.dot.gray{background:var(--text-3)}

/* mini calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px}
.cal .dh{color:var(--text-3);text-align:center;padding:4px 0}
.cal .day{aspect-ratio:1;background:var(--surface-2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px;font-size:11px;position:relative}
.cal .day .num{font-weight:500}
.cal .day .marks{position:absolute;bottom:3px;display:flex;gap:2px}
.cal .day.today{outline:2px solid var(--teal)}
.cal .day.empty{background:transparent}

/* collapsible calendar */
.cal-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.cal-toggle .arr{color:var(--text-3);font-size:12px;transition:transform .2s}
.cal-toggle.open .arr{transform:rotate(180deg)}
.cal-body{overflow:hidden;max-height:0;transition:max-height .3s ease;margin-top:0}
.cal-body.open{max-height:400px;margin-top:10px}

/* heatmap */
.heat{display:grid;gap:3px}
.heat .cell{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.heat .cell.l1{background:#cffbe9}
.heat .cell.l2{background:#7eecc8}
.heat .cell.l3{background:#37d4a3}
.heat .cell.l4{background:#00a884}
.heat .cell.l5{background:#007e63}

/* drawer */
.drawer{position:fixed;right:0;top:0;height:100vh;width:380px;background:var(--surface);border-left:1px solid var(--border);box-shadow:-12px 0 30px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .25s;z-index:50;padding:18px;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer h3{margin:0 0 12px}
.drawer .close{position:absolute;top:10px;right:10px;background:transparent;border:0;color:var(--text-2);font-size:18px}

/* insight */
.insight{background:linear-gradient(180deg,rgba(0,196,154,.08),rgba(0,196,154,0));border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text);}
.insight.warn{border-left-color:var(--amber);background:linear-gradient(180deg,rgba(245,158,11,.08),rgba(245,158,11,0))}
.insight.bad{border-left-color:var(--red);background:linear-gradient(180deg,rgba(239,68,68,.08),rgba(239,68,68,0))}

/* sparkline — wrap canvas in .spark-wrap so Chart.js reads a fixed height */
.spark-wrap{position:relative;height:64px;width:100%;margin-top:10px}
.spark-wrap canvas{display:block}

/* sidebar refresh button — teal background */
#sidebarRefresh{background:var(--teal) !important;color:#02201a !important;border:none !important;font-weight:600}

/* file list */
.filelist{display:flex;flex-direction:column;gap:6px}
.filerow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:12.5px}
.filerow .meta{margin-left:auto;color:var(--text-3);font-size:11.5px}

/* ai panel */
.ai-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media (max-width:900px){.ai-grid{grid-template-columns:1fr}}
.ai-prompts button{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;margin-bottom:6px;font-size:12.5px}
.ai-prompts button:hover{background:var(--surface-2)}
.ai-response{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;min-height:280px;overflow-y:auto;max-height:70vh}
.ai-response h1,.ai-response h2,.ai-response h3{font-weight:600}
.ai-response h2{font-size:16px}
.ai-response code{background:var(--surface-2);padding:2px 5px;border-radius:4px;font-size:12.5px}
.ai-response ul{padding-left:18px}

/* checkbox / check */
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);cursor:pointer}
.check input{accent-color:var(--teal)}

/* chip */
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;color:var(--text-2)}
.chip.sub{background:#EDE9FE;border-color:#C4B5FD;color:#5B21B6}
.chip.debit{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B}
.chip.income{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.chip.credit{background:#E0F2FE;border-color:#7DD3FC;color:#075985}
.chip.xfer-out{background:#FEF3C7;border-color:#FCD34D;color:#92400E}
.chip.xfer-in{background:#DBEAFE;border-color:#93C5FD;color:#1E40AF}

/* divider */
.hr{height:1px;background:var(--border);margin:8px 0}

/* loading dots */
.dots::after{content:'';animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* sortable header arrow */
th.sortable{cursor:pointer;user-select:none}
th.sortable .arr{color:var(--text-3);font-size:10px;margin-left:4px}

/* account group */
.acct-group{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;background:var(--surface-2)}
.acct-group .acct-head{font-weight:600;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.acct-group .acct-kind{font-size:11px;color:var(--text-3);font-weight:400}

/* multi-category chips in table */
.cat-chips{display:flex;flex-wrap:wrap;gap:4px}

/* pending file assignment */
.file-assign-row{display:grid;grid-template-columns:1fr 180px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:6px}
.file-assign-row .fname{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* allocation input */
.alloc-input{width:72px;text-align:right;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px}

/* KPI editable label — subtle cursor hint */
h3.kpi-label{cursor:text}
h3.kpi-label:hover{opacity:.85}
</style>
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">FL</div>
      <div>
        <div class="title">FinLens</div>
        <div class="sub">Personal Finances</div>
      </div>
    </div>

    <div class="group" data-section="finances">Finances <span class="nav-toggle">▼</span></div>
    <div class="nav-section" id="ns-finances">
      <a class="nav active" data-view="overview">🏠 Overview</a>
      <a class="nav" data-view="transactions">💳 Transactions</a>
    </div>

    <div class="group" data-section="plan">Plan <span class="nav-toggle">▼</span></div>
    <div class="nav-section" id="ns-plan">
      <a class="nav" data-view="budgets">📊 Budget</a>
      <a class="nav" data-view="buckets">🪣 Buckets</a>
      <a class="nav" data-view="debt">📉 Debt</a>
      <a class="nav" data-view="investments">📈 Investments</a>
      <a class="nav" data-view="forecast">🔮 Forecast</a>
    </div>

    <div class="group" data-section="insights">Insights <span class="nav-toggle">▼</span></div>
    <div class="nav-section" id="ns-insights">
      <a class="nav" data-view="trends">🔍 Trends</a>
      <a class="nav" data-view="ai">✨ AI Analysis</a>
    </div>

    <div style="margin-top:auto">
      <a class="nav" data-view="settings">⚙️ Settings</a>
      <div class="footer">
        <div style="color:var(--text-3);font-size:11px">v1.8.1 · FinLens</div>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <div class="crumb"><span id="pageTitle">Overview</span><span class="sub" id="rangeLabel">All time</span></div>
      <select id="rangeSelect" class="acct-filter" style="min-width:140px">
        <option value="week">This Week</option>
        <option value="pastweek">Past Week</option>
        <option value="month" selected>This Month</option>
        <option value="lastmonth">Last Month</option>
        <option value="last3months">Last 3 Months</option>
        <option value="last6months">Last 6 Months</option>
        <option value="ytd">YTD</option>
        <option value="lastyear">Last Year</option>
        <option value="all">All Time</option>
        <option value="custom">Custom…</option>
      </select>
      <input type="date" id="customStart" class="range-custom" style="display:none">
      <input type="date" id="customEnd" class="range-custom" style="display:none">
      <select id="acctFilter" class="acct-filter"><option value="all">All Accounts</option></select>
      <button class="btn ghost sm" id="themeToggle" title="Toggle theme">◐</button>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- transaction drawer -->
<div class="drawer" id="txDrawer">
  <button class="close" onclick="closeDrawer()">×</button>
  <h3>Transaction Detail</h3>
  <div id="drawerBody"></div>
</div>

<!-- file input (hidden) -->
<input type="file" id="folderPick" webkitdirectory directory multiple style="display:none">
<input type="file" id="filePick" multiple accept=".csv,.json" style="display:none">

<script>
// Collapsible sidebar sections — runs before core.js so use native querySelectorAll
document.addEventListener('DOMContentLoaded',()=>{
  const COLLAPSE_KEY='finlens_navCollapsed';
  let collapsed=JSON.parse(localStorage.getItem(COLLAPSE_KEY)||'{}');
  document.querySelectorAll('.sidebar .group[data-section]').forEach(grp=>{
    const id=grp.dataset.section;
    const sec=document.getElementById('ns-'+id);
    if (!sec) return;
    if (collapsed[id]){grp.classList.add('collapsed');sec.classList.add('collapsed');}
    grp.addEventListener('click',()=>{
      const isCollapsed=sec.classList.toggle('collapsed');
      grp.classList.toggle('collapsed',isCollapsed);
      collapsed[id]=isCollapsed;
      localStorage.setItem(COLLAPSE_KEY,JSON.stringify(collapsed));
    });
  });
});
</script>
<script src="js/core.js"></script>
<script src="js/aggregation.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/views-main.js"></script>
<script src="js/views-plan.js"></script>
<script src="js/views-invest.js"></script>
<script src="js/views-forecast.js"></script>
<script src="js/views-ai.js"></script>
<script src="js/views-data.js"></script>
<script src="js/views-settings.js"></script>
<script src="js/views-db.js"></script>
<script src="js/init.js"></script>
</body>
</html>
