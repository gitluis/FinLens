name: Deploy to GitHub Pages

# Publishes the app on every push to master (i.e. after a PR is merged), or by
# hand from the Actions tab. Pull requests never deploy.
#
# Before the first run: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Without it, this workflow fails at the deploy step.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a deploy mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Publish only what the app needs. docs/, CLAUDE.md, tests and CI files
      # stay in the repo but are not served.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r js samples _site/
          touch _site/.nojekyll
          echo "Published files:" && find _site -type f | sort
      - name: Refuse to publish data files
        run: |
          if find _site -iname 'finlens-state*.json' -o -iname 'finlens-export-*' -o -path '*/data/*' | grep -q .; then
            echo "::error::A data or backup file is in the site folder. Nothing was published."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
